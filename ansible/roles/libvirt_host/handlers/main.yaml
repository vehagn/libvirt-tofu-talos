---
- name: Reset connection
  ansible.builtin.meta: reset_connection

- name: Restart libvirtd
  ansible.builtin.service:
    name: "{{ libvirt_service }}"
    state: restarted

- name: Reload AppArmor
  ansible.builtin.service:
    name: apparmor
    state: reloaded

- name: Restart polkit
  ansible.builtin.service:
    name: polkit
    state: restarted

- name: Restart NetworkManager
  ansible.builtin.service:
    name: NetworkManager
    state: restarted
