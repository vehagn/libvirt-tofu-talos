---
- name: Install libvirt and QEMU packages
  ansible.builtin.apt:
    name: "{{ libvirt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install AppArmor packages
  ansible.builtin.apt:
    name: "{{ apparmor_packages }}"
    state: present

- name: Enable and start AppArmor
  ansible.builtin.service:
    name: apparmor
    state: started
    enabled: true

- name: Enable and start libvirtd
  ansible.builtin.service:
    name: "{{ libvirt_service }}"
    state: started
    enabled: true

- name: Ensure libvirt groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ libvirt_user_groups }}"

- name: Add user to libvirt groups
  ansible.builtin.user:
    name: "{{ libvirt_user }}"
    groups: "{{ libvirt_user_groups | join(',') }}"
    append: true
  notify: Reset connection

- name: Configure QEMU user, group, and security driver
  ansible.builtin.lineinfile:
    path: /etc/libvirt/qemu.conf
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: '{{ item.key }} = "{{ item.value }}"'
  loop:
    - { key: user, value: "{{ libvirt_qemu_user }}" }
    - { key: group, value: "{{ libvirt_qemu_group }}" }
    - { key: security_driver, value: "{{ libvirt_security_driver }}" }
  notify: Restart libvirtd

- name: Configure QEMU dynamic_ownership
  ansible.builtin.lineinfile:
    path: /etc/libvirt/qemu.conf
    regexp: "^#?\\s*dynamic_ownership\\s*="
    line: "dynamic_ownership = {{ libvirt_qemu_dynamic_ownership | int }}"
  notify: Restart libvirtd

- name: Allow libvirt user to manage libvirt via polkit
  ansible.builtin.copy:
    dest: "/etc/polkit-1/rules.d/50-libvirt-{{ libvirt_user }}.rules"
    owner: root
    group: root
    mode: "0644"
    content: |
      polkit.addRule(function(action, subject) {
        if (action.id.indexOf("org.libvirt.unix.") === 0 &&
            subject.user === "{{ libvirt_user }}") {
          return polkit.Result.YES;
        }
      });
  notify: Restart polkit

- name: Ensure local AppArmor abstractions directory exists
  ansible.builtin.file:
    path: /etc/apparmor.d/local/abstractions
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow QEMU domains to access libvirt storage pool
  ansible.builtin.blockinfile:
    path: /etc/apparmor.d/local/abstractions/libvirt-qemu
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED LIBVIRT STORAGE"
    block: |
      {{ libvirt_pool_path }}/ r,
      {{ libvirt_pool_path }}/** rwk,
  notify:
    - Reload AppArmor
    - Restart libvirtd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Configure host bridge for VM networking
  when: libvirt_bridge_configure
  block:
    - name: Enable NetworkManager to manage ifupdown interfaces
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/10-managed.conf
        content: |
          [ifupdown]
          managed=true
        mode: "0644"
      notify: Restart NetworkManager

    - name: Remove physical interface from /etc/network/interfaces
      ansible.builtin.replace:
        path: /etc/network/interfaces
        regexp: "^(allow-hotplug|auto|iface)\\s+{{ ansible_facts['default_ipv4']['interface'] }}(\\s.*)?$"
        replace: "#\\g<0>"
      notify: Restart NetworkManager

    - name: Flush handlers to restart NetworkManager before configuring bridge
      ansible.builtin.meta: flush_handlers

    - name: Check if bridge connection exists
      ansible.builtin.command: nmcli connection show "{{ libvirt_bridge_name }}"
      register: bridge_exists
      failed_when: false
      changed_when: false

    - name: Create bridge connection with DHCP
      ansible.builtin.command: >
        nmcli connection add
        type bridge
        con-name "{{ libvirt_bridge_name }}"
        ifname "{{ libvirt_bridge_name }}"
        bridge.mac-address "{{ ansible_facts['default_ipv4']['macaddress'] }}"
        ipv4.method auto
        ipv6.method ignore
        connection.autoconnect yes
      when: bridge_exists.rc != 0

    - name: Check if bridge slave connection exists
      ansible.builtin.command: nmcli connection show "{{ libvirt_bridge_name }}-slave"
      register: slave_exists
      failed_when: false
      changed_when: false

    - name: Add physical interface as bridge member
      ansible.builtin.command: >
        nmcli connection add
        type ethernet
        slave-type bridge
        con-name "{{ libvirt_bridge_name }}-slave"
        ifname "{{ ansible_facts['default_ipv4']['interface'] }}"
        master "{{ libvirt_bridge_name }}"
        connection.autoconnect yes
      when: slave_exists.rc != 0

    - name: Check if bridge connection is active
      ansible.builtin.command: nmcli connection show --active "{{ libvirt_bridge_name }}"
      register: bridge_active
      failed_when: false
      changed_when: false

    - name: Bring bridge up
      ansible.builtin.command: nmcli connection up "{{ libvirt_bridge_name }}"
      when: bridge_active.stdout == ""
